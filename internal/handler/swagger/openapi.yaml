components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    QuestionID:
      in: path
      name: questionID
      required: true
      schema:
        type: integer
        format: int64
    AnswerID:
      in: path
      name: answerID
      required: true
      schema:
        type: integer
        format: int64
    CommentID:
      in: path
      name: commentID
      required: true
      schema:
        type: integer
        format: int64
    AttachmentID:
      in: path
      name: attachmentID
      required: true
      schema:
        type: integer
        format: int64
    UserID:
      in: path
      name: userID
      required: true
      schema:
        type: integer
        format: int64
    CategoryID:
      in: path
      name: categoryID
      required: true
      schema:
        type: integer
        format: int64
    TagID:
      in: path
      name: tagID
      required: true
      schema:
        type: integer
        format: int64
    NotificationID:
      in: path
      name: notifID
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid request body

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: secret

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          example: c3d6f8a6dcb2433d9aef4f50daac3ef2

    Role:
      type: string
      enum: [GUEST, USER, SPECIALIST, ADMIN]

    QuestionStatus:
      type: string
      enum: [OPEN, CLOSED, DUPLICATE]

    VoteValue:
      type: string
      enum: [UP, DOWN]

    AttachmentTarget:
      type: string
      enum: [QUESTION, ANSWER, COMMENT]

    NotificationType:
      type: string
      enum:
        - NEW_ANSWER
        - ANSWER_VERIFIED
        - QUESTION_ASSIGNED
        - QUESTION_CLOSED
        - NEW_COMMENT

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        specialist_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time

    Question:
      type: object
      required:
        - id
        - author_id
        - author_username
        - title
        - body
        - status
        - view_count
        - answer_count
        - has_verified
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_username:
          type: string
        category_id:
          type: integer
          format: int64
          nullable: true
        specialist_id:
          type: integer
          format: int64
          nullable: true
        specialist_username:
          type: string
          nullable: true
        duplicate_of:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/QuestionStatus"
        view_count:
          type: integer
        answer_count:
          type: integer
        has_verified:
          type: boolean
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QuestionListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Answer:
      type: object
      required:
        - id
        - question_id
        - author_id
        - author_username
        - body
        - is_verified
        - vote_score
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        question_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_username:
          type: string
        body:
          type: string
        is_verified:
          type: boolean
        vote_score:
          type: integer
        current_user_vote:
          $ref: "#/components/schemas/VoteValue"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Comment:
      type: object
      required:
        - id
        - answer_id
        - author_id
        - author_username
        - body
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        answer_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_username:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Attachment:
      type: object
      required:
        - id
        - uploader_id
        - target_type
        - target_id
        - filename
        - mime_type
        - size_bytes
        - url
      properties:
        id:
          type: integer
          format: int64
        uploader_id:
          type: integer
          format: int64
        target_type:
          $ref: "#/components/schemas/AttachmentTarget"
        target_id:
          type: integer
          format: int64
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        url:
          type: string
          example: /attachments/15

    SearchResult:
      type: object
      required:
        - type
        - question_id
        - question_title
        - snippet
        - status
        - author_id
        - created_at
        - rank
      properties:
        type:
          type: string
          enum: [question, answer]
        answer_id:
          type: integer
          format: int64
          nullable: true
        question_id:
          type: integer
          format: int64
        question_title:
          type: string
        snippet:
          type: string
        status:
          $ref: "#/components/schemas/QuestionStatus"
        author_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        rank:
          type: number
          format: float

    SearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer

    PrivateUser:
      type: object
      required:
        - id
        - username
        - email
        - role
        - reputation
        - is_active
        - created_at
        - question_count
        - answer_count
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        reputation:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        question_count:
          type: integer
        answer_count:
          type: integer

    PublicUser:
      type: object
      required:
        - id
        - username
        - role
        - reputation
        - created_at
        - question_count
        - answer_count
        - recent_questions
        - recent_answers
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        reputation:
          type: integer
        created_at:
          type: string
          format: date-time
        question_count:
          type: integer
        answer_count:
          type: integer
        recent_questions:
          type: array
          items:
            $ref: "#/components/schemas/RecentQuestion"
        recent_answers:
          type: array
          items:
            $ref: "#/components/schemas/RecentAnswer"

    RecentQuestion:
      type: object
      required: [id, title, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: "#/components/schemas/QuestionStatus"
        created_at:
          type: string
          format: date-time

    RecentAnswer:
      type: object
      required: [id, question_id, snippet, created_at]
      properties:
        id:
          type: integer
          format: int64
        question_id:
          type: integer
          format: int64
        snippet:
          type: string
        created_at:
          type: string
          format: date-time

    NotificationPayload:
      type: object
      properties:
        question_id:
          type: integer
          format: int64
        question_title:
          type: string
        answer_id:
          type: integer
          format: int64
        comment_id:
          type: integer
          format: int64
        actor_username:
          type: string

    Notification:
      type: object
      required: [id, type, payload, is_read, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/NotificationType"
        payload:
          $ref: "#/components/schemas/NotificationPayload"
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationPreference:
      type: object
      required: [type, email_enabled]
      properties:
        type:
          $ref: "#/components/schemas/NotificationType"
        email_enabled:
          type: boolean

    QuestionHistoryEntry:
      type: object
      required: [id, editor_id, editor_username, title, body, edited_at]
      properties:
        id:
          type: integer
          format: int64
        editor_id:
          type: integer
          format: int64
        editor_username:
          type: string
        title:
          type: string
        body:
          type: string
        edited_at:
          type: string
          format: date-time

    AnswerHistoryEntry:
      type: object
      required: [id, editor_id, editor_username, body, edited_at]
      properties:
        id:
          type: integer
          format: int64
        editor_id:
          type: integer
          format: int64
        editor_username:
          type: string
        body:
          type: string
        edited_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, username, email, role, is_active, reputation]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        is_active:
          type: boolean
        reputation:
          type: integer

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    CreateQuestionRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        category_id:
          type: integer
          format: int64
          nullable: true
        tag_ids:
          type: array
          items:
            type: integer
            format: int64

    UpdateQuestionRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        tag_ids:
          type: array
          items:
            type: integer
            format: int64

    AssignQuestionRequest:
      type: object
      properties:
        specialist_id:
          type: integer
          format: int64
          nullable: true

    DuplicateQuestionRequest:
      type: object
      required: [duplicate_of]
      properties:
        duplicate_of:
          type: integer
          format: int64

    BodyRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    VoteRequest:
      type: object
      required: [value]
      properties:
        value:
          $ref: "#/components/schemas/VoteValue"

    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: "#/components/schemas/Role"

    ChangeUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    SetUserActiveRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    CategoryMutationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        specialist_id:
          type: integer
          format: int64
          nullable: true

    TagMutationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    TrainingEntry:
      type: object
      required: [id, title, questions, positive, original]
      properties:
        id:
          type: integer
        title:
          type: string
        questions:
          type: array
          items:
            type: string
        positive:
          type: string
        original:
          type: string

    ImportRequest:
      type: object
      required: [training_data]
      properties:
        training_data:
          type: array
          items:
            $ref: "#/components/schemas/TrainingEntry"

    ImportedCountResponse:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer

    ExportResponse:
      type: object
      required: [training_data]
      properties:
        training_data:
          type: array
          items:
            $ref: "#/components/schemas/TrainingEntry"

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
