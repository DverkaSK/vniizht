openapi: 3.0.3
info:
  title: ISS APK Elbrus API
  version: "1.0.0"
  description: |
    REST API for the ISS APK Elbrus knowledge base.

    Protected endpoints accept either:
    - a `Bearer` token returned by `POST /auth/login`
    - a `session` cookie created by the same login endpoint

servers:
  - url: /api
    description: API behind nginx reverse proxy

tags:
  - name: Auth
  - name: Health
  - name: Questions
  - name: Answers
  - name: Comments
  - name: Attachments
  - name: Search
  - name: Users
  - name: Notifications
  - name: Admin
  - name: Import

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Logged out

  /search:
    get:
      tags: [Search]
      summary: Full-text search
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
            format: int64
        - in: query
          name: tag_id
          schema:
            type: integer
            format: int64
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/Error400"

  /categories:
    get:
      tags: [Admin]
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /tags:
    get:
      tags: [Admin]
      summary: List tags
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"

  /questions:
    get:
      tags: [Questions]
      summary: List questions
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/QuestionStatus"
        - in: query
          name: category_id
          schema:
            type: integer
            format: int64
        - in: query
          name: tag_id
          schema:
            type: integer
            format: int64
        - in: query
          name: assigned_specialist_id
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Paginated question list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionListResponse"
        "400":
          $ref: "#/components/responses/Error400"
    post:
      tags: [Questions]
      summary: Create question
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"

  /questions/{questionID}:
    get:
      tags: [Questions]
      summary: Get question
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "200":
          description: Question details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
    patch:
      tags: [Questions]
      summary: Update question
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "204":
          description: Question updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
    delete:
      tags: [Questions]
      summary: Delete question
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "204":
          description: Question deleted
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /questions/{questionID}/close:
    patch:
      tags: [Questions]
      summary: Close question
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "204":
          description: Question closed
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /questions/{questionID}/duplicate:
    patch:
      tags: [Questions]
      summary: Mark question as duplicate
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateQuestionRequest"
      responses:
        "204":
          description: Question marked as duplicate
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /questions/{questionID}/assign:
    patch:
      tags: [Questions]
      summary: Assign specialist to question
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignQuestionRequest"
      responses:
        "204":
          description: Specialist assigned
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /questions/{questionID}/history:
    get:
      tags: [Questions]
      summary: Get question history
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "200":
          description: Question history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionHistoryEntry"
        "400":
          $ref: "#/components/responses/Error400"

  /questions/{questionID}/answers:
    get:
      tags: [Answers]
      summary: List answers for question
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "200":
          description: Answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/Error400"
    post:
      tags: [Answers]
      summary: Create answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QuestionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyRequest"
      responses:
        "201":
          description: Answer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /answers/{answerID}:
    patch:
      tags: [Answers]
      summary: Update answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyRequest"
      responses:
        "204":
          description: Answer updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    delete:
      tags: [Answers]
      summary: Delete answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "204":
          description: Answer deleted
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /answers/{answerID}/verify:
    patch:
      tags: [Answers]
      summary: Verify answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "204":
          description: Answer verified
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    delete:
      tags: [Answers]
      summary: Remove verification from answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "204":
          description: Verification removed
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /answers/{answerID}/vote:
    post:
      tags: [Answers]
      summary: Create vote for answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "204":
          description: Vote created
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
    patch:
      tags: [Answers]
      summary: Update vote for answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "204":
          description: Vote updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
    delete:
      tags: [Answers]
      summary: Delete vote for answer
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "204":
          description: Vote deleted
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

  /answers/{answerID}/history:
    get:
      tags: [Answers]
      summary: Get answer history
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "200":
          description: Answer history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnswerHistoryEntry"
        "400":
          $ref: "#/components/responses/Error400"

  /answers/{answerID}/comments:
    get:
      tags: [Comments]
      summary: List comments for answer
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error400"
    post:
      tags: [Comments]
      summary: Create comment
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AnswerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"

  /comments/{commentID}:
    patch:
      tags: [Comments]
      summary: Update comment
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyRequest"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
    delete:
      tags: [Comments]
      summary: Delete comment
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentID"
      responses:
        "204":
          description: Comment deleted
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /attachments:
    get:
      tags: [Attachments]
      summary: List attachments
      parameters:
        - in: query
          name: target_type
          required: true
          schema:
            $ref: "#/components/schemas/AttachmentTarget"
        - in: query
          name: target_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/Error400"
    post:
      tags: [Attachments]
      summary: Upload attachment
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_type, target_id]
              properties:
                file:
                  type: string
                  format: binary
                target_type:
                  $ref: "#/components/schemas/AttachmentTarget"
                target_id:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"

  /attachments/{attachmentID}:
    get:
      tags: [Attachments]
      summary: Download attachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
    delete:
      tags: [Attachments]
      summary: Delete attachment
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "204":
          description: Attachment deleted
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateUser"
        "401":
          $ref: "#/components/responses/Error401"

  /users/{userID}:
    get:
      tags: [Users]
      summary: Get public user profile
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Error401"

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notifications count
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          $ref: "#/components/responses/Error401"

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: All notifications marked as read
        "401":
          $ref: "#/components/responses/Error401"

  /notifications/{notifID}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationID"
      responses:
        "204":
          description: Notification marked as read
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Error401"
    put:
      tags: [Notifications]
      summary: Save notification preferences
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/NotificationPreference"
      responses:
        "204":
          description: Preferences saved
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: [Admin]
      summary: Create user
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"

  /admin/users/{userID}/role:
    patch:
      tags: [Admin]
      summary: Change user role
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserRoleRequest"
      responses:
        "204":
          description: User role updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /admin/users/{userID}/active:
    patch:
      tags: [Admin]
      summary: Activate or deactivate user
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserActiveRequest"
      responses:
        "204":
          description: User activity updated
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /admin/categories:
    get:
      tags: [Admin]
      summary: List categories for admin
      security:
        - bearerAuth: []
        - cookieAuth: []
